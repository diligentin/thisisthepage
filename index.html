<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="icon" type="image/png" href="https://diligentin.github.io/main/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tajna chałupka</title>
  
<style>
@font-face { font-family: "figtree"; src: url("https://diligentin.github.io/main/Figtree.ttf"); }

body { margin:0; background:#191818; color:white; font-family: figtree, sans-serif;}

.hero { display:flex; justify-content:center; padding:15px 0; }
.hero img { width:160px; }

.section-block { width:min(100%,1000px); margin:0 auto; padding:0 9px; box-sizing:border-box;}

.section-title-img { display:block; width:100%; max-width:200px; margin:35px 0 20px 0;}

.auto-flex{
  display: flex;
  flex-wrap: wrap;
  justify-content: center; /* wyśrodkuje ostatni „rząd” jako grupę */
  gap: 9px;

  width: 100%;
  box-sizing: border-box;
}


.card{  width: 150px;      /* dopasuj do swoich max-width=150px w obrazach */  flex: 0 0 150px;  /* niech nie rośnie i nie kurczy się */  text-decoration:none;  color:white;  text-align:center;}
.card img{
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.card:hover img { transform: none; filter: brightness(0.8);}


.card.square img { width:100%; max-width:150px; border-radius:2px; aspect-ratio:1/1; object-fit:cover;}

.card.tall img { width:100%; max-width:150px; border-radius:2px; aspect-ratio:5/9; object-fit:cover;}

@media (max-width: 600px){ .section-block .titles-flex > .card{ flex: 0 0 33.33%;  /* 3 na wiersz */ max-width: 33.33%;  }}


</style>
</head>

<body>

<header class="hero">
  <img src="https://diligentin.github.io/main/logo.png" alt="">
</header>

<div class="section-block">

  <div id="titles-grid" class="auto-flex">

    <a class="card square" href="reader.html?comic=at&chapter=2">

<!-- OZNACZENIE 18+ -->
<div style="text-align:center; margin:40px 0;">
  <img src="https://diligentin.github.io/main/info-i-18.png"
       style="max-width:470px; width:100%; height:auto;">
</div>

<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) card.classList.add("read");
  }
});
</script>
