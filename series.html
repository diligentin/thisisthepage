<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://diligentin.github.io/main/favicon.png">
<title id="page-title">czekaj, myślę...</title>

<style>
@font-face { font-family: "figtree"; src: url("https://diligentin.github.io/main/Figtree.ttf"); }

body {
  margin: 0; background: #191818; color: white;
  font-family: figtree, sans-serif;
}
a { color: white; text-decoration: none; }

/* HOME BUTTON */
.back {
  position: fixed; top: 12px; left: 12px;
  opacity: .9; transition: opacity .2s;
}
.back:hover { opacity: 1; }
.back img { width: 40px; }

/* LAYOUT */
.comic-layout {
  display: flex; gap: 32px; padding: 40px;
  justify-content: center; flex-wrap: wrap;
}
.cover { width: 100%; max-width: 299px; height: auto; object-fit: contain; border-radius: 2px; display: none; }
.comic-info { max-width: 600px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
.comic-header-img { width: 100%; max-width: 600px; margin: 0 auto 13px; }

/* OPIS */
.comic-desc { font-size: 17px; color: #e0e0e0; line-height: 1.3; text-align: justify; }

/* SEKCJA */
.section { padding: 24px 16px; }
.section h2 { font-size: 26px; font-weight: 100; text-align: center; margin-bottom: 30px; }

/* ROZDZIAŁY */
.chapter-grid {
  display: grid; grid-template-columns: repeat(auto-fit, 45px);
  gap: 11px; justify-content: center;
  max-width: 600px; margin: 0 auto 40px;
}
.chapter-btn {
  width: 45px; height: 45px; background: #272727;
  border-radius: 2px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 200; transition: .2s;
}
.chapter-btn:hover { background: #2a2a2a; }
.chapter-btn.visited { color: #8394F4; }

@media (max-width: 600px) {
  body { zoom: .9; }
  .comic-header-img { width: 120%; transform: translateX(-10%); }
}
</style>
</head>

<body>

<a class="back" href="https://diligentin.github.io/thisisthepage/">
  <img src="https://diligentin.github.io/main/domek.png">
</a>

<div class="comic-layout">
  <img id="cover" class="cover">
  <div class="comic-info">
    <img id="header-img" class="comic-header-img">
    <p id="desc" class="comic-desc"></p>
  </div>
</div>

<div class="section">
 
  <div id="chapters-container"></div>
</div>

<script>
(async function () {

  /* PARAMETR ?comic= */
  const comicKey = new URLSearchParams(location.search).get("comic");
  if (!comicKey) {
    document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Brak parametru ?comic=</p>";
    return;
  }

  /* JSON */
  let data;
  try {
    data = await fetch(`${comicKey}.json`).then(r => r.json());
  } catch {
    document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Błąd JSON</p>";
    return;
  }

  /* USTAWIENIA */
  document.getElementById("page-title").textContent = data.title || comicKey;
  document.getElementById("cover").src = data.cover;
  cover.onload = () => cover.style.display = "block";
  document.getElementById("header-img").src = data.header_img;
  document.getElementById("desc").innerHTML = data.desc.replace(/\n/g, "<br>");

const container = document.getElementById("chapters-container");


/*
 * Pobieramy kolejność rozdziałów bezpośrednio z surowego JSON-a.
 * Dzięki temu kolejność jest identyczna jak w readerze.
 */
const chapterOrder = [];

rawJson.replace(
  /"chapters"\s*:\s*{([\s\S]*?)}/,
  (match, inner) => {
    inner.replace(
      /"([^"]+)"\s*:/g,
      (_, chapterName) => {
        chapterOrder.push(chapterName);
      }
    );
  }
);


/*
 * Usuwamy ewentualne duplikaty,
 * ale zachowujemy pierwszą kolejność wystąpienia.
 */
const uniqueChapterOrder = [
  ...new Set(chapterOrder)
];


/* FUNKCJA TWORZENIA PRZYCISKU */
function makeBtn(chapterName) {
  const a = document.createElement("a");

  a.href =
    `reader.html?comic=${encodeURIComponent(comicKey)}` +
    `&chapter=${encodeURIComponent(chapterName)}`;

  const btn = document.createElement("div");
  btn.className = "chapter-btn";
  btn.textContent = chapterName;

  if (
    localStorage.getItem(`read_${comicKey}_${chapterName}`) === "1"
  ) {
    btn.classList.add("visited");
  }

  a.appendChild(btn);
  return a;
}


/*
 * BEZ SEZONÓW
 */
if (!data.seasons) {
  const grid = document.createElement("div");
  grid.className = "chapter-grid";

  uniqueChapterOrder.forEach(chapterName => {
    grid.appendChild(makeBtn(chapterName));
  });

  container.appendChild(grid);
  return;
}


/*
 * Z SEZONAMI
 *
 * Rozdziały są sprawdzane według wartości numerowej,
 * ale wyświetlane w kolejności z JSON-a.
 *
 * Dzięki temu:
 *
 * Tom 1: 1–9.3
 * obejmie:
 * 1, 2, 3, ..., 9, 9.1, 9.2, 9.3
 *
 * Tom 2: 10–∞
 * obejmie:
 * 10, 11, ..., 19, 13.1, 18.1, 18.2 itd.
 */
const addedChapters = new Set();

for (const [seasonName, range] of Object.entries(data.seasons)) {

  const fromName = String(range.from);
  const toName = range.to === "∞"
    ? "∞"
    : String(range.to);

  const fromNumber = Number(fromName);

  const toNumber = toName === "∞"
    ? Infinity
    : Number(toName);


  const h = document.createElement("h3");
  h.style.textAlign = "center";
  h.style.fontWeight = "50";
  h.style.fontSize = "20px";
  h.style.marginTop = "10px";
  h.textContent = seasonName;


  const grid = document.createElement("div");
  grid.className = "chapter-grid";


  uniqueChapterOrder.forEach(chapterName => {

    /*
     * Rozdział już został dodany do wcześniejszego tomu.
     */
    if (addedChapters.has(chapterName)) {
      return;
    }


    const chapterNumber = Number(chapterName);
    const isNumericChapter = !isNaN(chapterNumber);

    let fits = false;


    /*
     * Zakres numeryczny.
     *
     * Przykład:
     * from: "1", to: "9.3"
     *
     * Rozdziały 9.1, 9.2 i 9.3
     * mają wartości mieszczące się w tym zakresie.
     */
    if (
      isNumericChapter &&
      !isNaN(fromNumber) &&
      chapterNumber >= fromNumber &&
      chapterNumber <= toNumber
    ) {
      fits = true;
    }


    /*
     * Dokładne dopasowanie rozdziału tekstowego
     * albo emoji.
     *
     * Przykład:
     * from: "bonus", to: "bonus"
     */
    if (
      !isNumericChapter &&
      fromName === toName &&
      chapterName === fromName
    ) {
      fits = true;
    }


    /*
     * Rozdział tekstowy od wskazanego miejsca do końca.
     *
     * Przykład:
     * from: "bonus", to: "∞"
     */
    if (
      !isNumericChapter &&
      chapterName === fromName &&
      toName === "∞"
    ) {
      fits = true;
    }


    /*
     * Nienumeryczne dodatki przy sezonie
     * rozpoczynającym się numerem i trwającym do końca.
     *
     * Przykład:
     * from: "10", to: "∞"
     *
     * Dzięki temu dodatki typu:
     * ą, 000🎈, 69🎈, 888🎈
     * trafiają do ostatniego tomu.
     */
    if (
      !isNumericChapter &&
      !isNaN(fromNumber) &&
      toName === "∞"
    ) {
      fits = true;
    }


    if (fits) {
      addedChapters.add(chapterName);
      grid.appendChild(makeBtn(chapterName));
    }
  });


  /*
   * Nie pokazujemy pustego tomu.
   */
  if (grid.children.length > 0) {
    container.appendChild(h);
    container.appendChild(grid);
  }
}


})();
</script>

</body>
</html>
